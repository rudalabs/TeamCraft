# TeamCraft CI: formatting, lints and the full test suite against
# PostgreSQL on Linux (with coverage on one leg); build and unit tests on
# Windows (and macOS on main); dependency checks. Nothing is packaged or
# published.
#
# Runner time is free for this public repository; what is scarce is the
# number of concurrent jobs (20, of them 5 macOS). Pull requests therefore
# run the jobs that can find something new there; main runs everything.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "platforms/**"]
  # Every pull request, also one that changes only documentation: the job
  # "CI result" is the required check of main and must report on each of them.
  # The changes job below skips the Rust jobs for documentation-only changes.
  pull_request:
  # a merge queue (Settings → Rules) tests every pull request against the
  # main it lands on; the required checks must run here too, so no path
  # filter (a merge_group event has none anyway)
  merge_group:
  # new security advisories appear without a code change
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks. Everything else
# – each commit on main, each merge-queue entry – gets its own group and is
# never cancelled: with one group for main, a third push within one run
# cancelled the waiting run of the second ("Canceling since a higher priority
# waiting request exists"), and its commit showed a red ✗ (#275).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Whether the Rust jobs have anything to check: not for a pull request
  # that changes only documentation (*.md, docs/, platforms/ – the paths the
  # push trigger ignores) and not for the weekly advisory run.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: c
        shell: bash
        run: |
          set -euo pipefail
          code=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then code=false; fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # the merge commit of the pull request: HEAD^1 is the base
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "$changed"
            grep -qvE '.md$|^docs/|^platforms/' <<<"$changed" || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: fmt and clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # pull requests read the caches of main but do not write their own
      # (they would push the main caches out of the 10 GB limit)
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # broken or private intra-doc links fail here, not only on the docs site
      - name: rustdoc without warnings
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    # PostgreSQL 16 (the oldest supported version) runs the plain suite and
    # the CLI smoke test; PostgreSQL 18 runs the same suite under
    # cargo llvm-cov with the coverage report and floor
    # (docs/src/dev/coverage.md).
    name: tests (Linux, PostgreSQL ${{ matrix.postgres }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "16"
            coverage: false
          - postgres: "18"
            coverage: true
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: teamcraft
          POSTGRES_DB: teamcraft
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamcraft -d teamcraft"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEAMCRAFT_TEST_DATABASE_URL: postgres://teamcraft@localhost:5432/teamcraft
      TEAMCRAFT_REQUIRE_DB_TESTS: "1"
      # tests/backup_restore.rs runs pg_dump/pg_restore against the server
      TEAMCRAFT_REQUIRE_PG_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL ${{ matrix.postgres }} client tools (pg_dump, pg_restore)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.coverage && 'llvm-tools-preview' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ matrix.postgres }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        if: ${{ !matrix.coverage }}
        with:
          tool: cargo-nextest
      # nextest kills a test that runs over its limit (.config/nextest.toml:
      # 1 s for unit tests), so a hang fails at once instead of stalling the job
      - if: ${{ !matrix.coverage }}
        run: cargo nextest run --locked --no-fail-fast
      - name: doc tests (nextest does not run them)
        if: ${{ !matrix.coverage }}
        run: cargo test --locked --doc
      - name: CLI smoke test
        if: ${{ !matrix.coverage }}
        env:
          TEAMCRAFT_DATABASE_URL: postgres://teamcraft@localhost:5432/teamcraft
        run: |
          cargo run --locked --quiet -- migrate
          cargo run --locked --quiet -- vault check
          cargo run --locked --quiet -- preview-mesh --format step --input tests/fixtures/cube.step --output cube.tcm
          test -s cube.tcm
          cargo run --locked --quiet -- backup "$RUNNER_TEMP/backup"
          createdb -h localhost -U teamcraft teamcraft_restored
          TEAMCRAFT_DATABASE_URL=postgres://teamcraft@localhost:5432/teamcraft_restored \
          TEAMCRAFT_VAULT_DIR="$RUNNER_TEMP/vault-restored" \
            cargo run --locked --quiet -- restore "$RUNNER_TEMP/backup"

      - if: ${{ matrix.coverage }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run the tests with coverage
        if: ${{ matrix.coverage }}
        run: cargo llvm-cov --locked --no-report --no-fail-fast
      # the report and the floor also when a test failed: the numbers help
      - name: Summary per file
        if: ${{ matrix.coverage && !cancelled() }}
        run: |
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          {
            echo '### Line coverage per file'
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: HTML report
        if: ${{ matrix.coverage && !cancelled() }}
        run: cargo llvm-cov report --html
      - if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            target/llvm-cov/html
            coverage-summary.txt
          retention-days: 14
      - name: Coverage floor (.github/coverage-floor)
        if: ${{ matrix.coverage && !cancelled() }}
        run: |
          floor=$(grep -v '^#' .github/coverage-floor | tr -d '[:space:]')
          lines=$(awk '/^TOTAL/ { gsub("%", "", $10); print $10 }' coverage-summary.txt)
          if [ -z "$floor" ] || [ -z "$lines" ]; then
            echo "::error::cannot read the floor ('$floor') or the total line coverage ('$lines')"
            exit 1
          fi
          echo "Total line coverage: ${lines} % (floor ${floor} %)" | tee -a "$GITHUB_STEP_SUMMARY"
          if awk -v l="$lines" -v f="$floor" 'BEGIN { exit !(l + 0 < f + 0) }'; then
            echo "::error::line coverage ${lines} % is below the floor ${floor} % – add tests for the new code, or lower .github/coverage-floor in this pull request and say why"
            exit 1
          fi

  build:
    # The Windows server ships, so it is built on every pull request. macOS
    # (no server release, scarce runners, never failed on its own) only on
    # main and by hand. The test targets are type-checked, not linked: the
    # database tests do not run here.
    name: build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked
      - name: type-check every target (tests, examples)
        run: cargo check --locked --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: unit tests (the database tests run on Linux; 1 s limit, see .config/nextest.toml)
        run: cargo nextest run --locked --lib

  dependencies:
    # the server and the desktop app ship separate lock files
    name: cargo deny (${{ matrix.manifest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, desktop/Cargo.toml]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}

  # The one check that branch protection or the merge queue requires (see
  # CONTRIBUTING.md, "Merging"): green when every job above passed or was
  # skipped on purpose, red when one failed or was cancelled. One name instead
  # of the job list keeps the rule valid when a job or a matrix entry changes,
  # and a skipped matrix job reports under its unexpanded name, which a
  # required check of that name would wait for forever.
  result:
    name: CI result
    if: always()
    needs: [changes, lint, test, build, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a CI job ended with '$r'"; exit 1 ;;
            esac
          done
