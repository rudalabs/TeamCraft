# TeamCraft CI: formatting, lints and the full test suite against
# PostgreSQL on Linux; build and unit tests on macOS and Windows.
# Nothing is packaged or published.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "platforms/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "platforms/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: tests (Linux, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: teamcraft
          POSTGRES_DB: teamcraft
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamcraft -d teamcraft"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEAMCRAFT_TEST_DATABASE_URL: postgres://teamcraft@localhost:5432/teamcraft
      TEAMCRAFT_REQUIRE_DB_TESTS: "1"
      # tests/backup_restore.rs runs pg_dump/pg_restore against the server
      TEAMCRAFT_REQUIRE_PG_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL ${{ matrix.postgres }} client tools (pg_dump, pg_restore)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast
      - name: CLI smoke test
        env:
          TEAMCRAFT_DATABASE_URL: postgres://teamcraft@localhost:5432/teamcraft
        run: |
          cargo run --locked --quiet -- migrate
          cargo run --locked --quiet -- vault check
          cargo run --locked --quiet -- preview-mesh --format step --input tests/fixtures/cube.step --output cube.tcm
          test -s cube.tcm
          cargo run --locked --quiet -- backup "$RUNNER_TEMP/backup"
          createdb -h localhost -U teamcraft teamcraft_restored
          TEAMCRAFT_DATABASE_URL=postgres://teamcraft@localhost:5432/teamcraft_restored \
          TEAMCRAFT_VAULT_DIR="$RUNNER_TEMP/vault-restored" \
            cargo run --locked --quiet -- restore "$RUNNER_TEMP/backup"

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - name: unit tests (the database tests run on Linux)
        run: cargo test --locked --lib

  dependencies:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    # Report only: no threshold yet (docs/src/dev/coverage.md). The unit and
    # the database tests run together, so the numbers include the services.
    name: coverage (report only)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamcraft
          POSTGRES_DB: teamcraft
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamcraft -d teamcraft"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEAMCRAFT_TEST_DATABASE_URL: postgres://teamcraft@localhost:5432/teamcraft
      TEAMCRAFT_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 client tools (pg_dump, pg_restore)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run the tests with coverage
        run: cargo llvm-cov --locked --no-report --no-fail-fast
      - name: Summary per file
        run: |
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          {
            echo '### Line coverage per file'
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: HTML report
        run: cargo llvm-cov report --html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            target/llvm-cov/html
            coverage-summary.txt
          retention-days: 14
