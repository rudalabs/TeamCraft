# README screenshots: builds TeamCraft, starts it against an empty
# PostgreSQL, seeds demo data and captures the pages with headless Chrome
# (scripts/screenshots.sh). The PNGs are uploaded as the "screenshots"
# artifact; this workflow never commits anything – see CONTRIBUTING.md,
# "Updating the README screenshots".
name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/screenshots.sh
      - .github/workflows/screenshots.yml

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  screenshots:
    name: capture the README screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teamcraft
          POSTGRES_DB: teamcraft
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamcraft -d teamcraft"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEAMCRAFT_DATABASE_URL: postgres://teamcraft@localhost:5432/teamcraft
      # Loopback only: the first-start page that creates the administrator
      # is offered only then.
      TEAMCRAFT_BIND_ADDR: 127.0.0.1:8080
      TEAMCRAFT_PUBLIC_URL: http://127.0.0.1:8080
      TEAMCRAFT_INSTANCE_NAME: TeamCraft
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Start TeamCraft
        run: |
          mkdir -p "$RUNNER_TEMP/vault"
          TEAMCRAFT_VAULT_DIR="$RUNNER_TEMP/vault" \
            nohup ./target/release/teamcraft serve >"$RUNNER_TEMP/teamcraft.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/readyz >/dev/null; then
              echo "TeamCraft is ready"
              exit 0
            fi
            sleep 2
          done
          echo "TeamCraft did not become ready" >&2
          tail -n 100 "$RUNNER_TEMP/teamcraft.log" >&2
          exit 1

      - name: Browser versions
        run: |
          google-chrome --version || true
          (command -v chromedriver && chromedriver --version) || "$CHROMEWEBDRIVER/chromedriver" --version || true
          jq --version

      - name: Seed demo data and capture
        env:
          BASE_URL: http://127.0.0.1:8080
          OUT_DIR: ${{ runner.temp }}/screenshots
        run: scripts/screenshots.sh

      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/teamcraft.log"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          retention-days: 30
          if-no-files-found: error
