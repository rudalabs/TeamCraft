# TeamCraft Desktop: formatting, lints, tests and a start-up smoke test on
# Linux (x86_64, ARM64), macOS (ARM64) and Windows (x86_64, ARM64 preview),
# plus a syntax check of the user interfaces (desktop/ui, static, shared).
# Installers are not built or published.
name: Desktop app

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "scripts/check-desktop-modules.mjs"
      - "scripts/desktop-tab-order.test.mjs"
      - "scripts/desktop-files-view.test.mjs"
      - "static/**"
      - "shared/**"
      - "media/logos/**"
      - "media/icons/**"
      - ".github/workflows/desktop.yml"
  schedule:
    - cron: "41 4 * * 1"
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/check-desktop-modules.mjs"
      - "scripts/desktop-tab-order.test.mjs"
      - "scripts/desktop-files-view.test.mjs"
      - "static/**"
      - "shared/**"
      - "media/logos/**"
      - "media/icons/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks; each commit on
# main keeps its own run, so that no commit on main shows a red ✗ only
# because a later push cancelled its run (#275).
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ui:
    name: desktop UI (JavaScript syntax)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The runner's own Node.js is only used to parse the files – the app
      # itself has no build step and no Node.js dependency.
      - name: Parse every script of the desktop and web UI
        run: |
          set -e
          node --version
          for f in static/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
          # shared/ and desktop/ui/js/ hold ES modules: without a package.json
          # Node reads .js as CommonJS, so parse them as modules from stdin.
          find shared desktop/ui/js -name '*.js' -print | sort | while read -r f; do
            echo "node --input-type=module --check < $f"
            node --input-type=module --check < "$f"
          done
      # the desktop modules: every import resolves, every name of another
      # module that is used is imported, all reachable from js/main.js
      - name: Check the imports of the desktop UI modules
        run: node scripts/check-desktop-modules.mjs
      # the pure rules of the tab order (moving, switching, closing)
      - name: Test the tab order rules
        run: node scripts/desktop-tab-order.test.mjs
      # the pure rules of the Files view of Home (orders, labels, pages)
      - name: Test the rules of the Files view
        run: node scripts/desktop-files-view.test.mjs

  test:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # ARM64 Windows runners are still a preview: report, but never block.
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: one leg per release architecture (the cfgs in
        # desktop/src; Windows ARM64 still reports only, see above). Main,
        # the weekly run and manual runs add the newer Ubuntu (WebKitGTK
        # drift).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]' || '["ubuntu-26.04", "ubuntu-24.04", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # formatting does not depend on the platform
      - name: fmt
        if: matrix.os == 'ubuntu-24.04'
        working-directory: desktop
        run: cargo fmt --all -- --check
      - name: clippy, tests
        working-directory: desktop
        shell: bash
        run: |
          cargo clippy|
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build the app
        working-directory: desktop
        run: cargo build --locked

      # Start the real app (web view, menu, settings) with a fresh profile and
      # check it is still running after 20 seconds: catches crashes at start-up
      # that unit tests cannot see. Without a server it shows its connect page.
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          # The app's status goes through a file: xvfb-run itself sometimes
          # fails while cleaning up its temporary directory ("problem while
          # cleaning up temporary directory", exit 1) after the app ran fine.
          rm -f smoke.status
          xvfb-run -a sh -c 'WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            timeout 20 desktop/target/debug/teamcraft-desktop > smoke.log 2>&1; echo $? > smoke.status'
          xvfb=$?
          cat smoke.log
          if [ ! -s smoke.status ]; then echo "xvfb-run failed with $xvfb before the app ran"; exit 1; fi
          status=$(cat smoke.status)
          # 124 = still running when the timeout stopped it
          if [ "$status" -ne 124 ]; then echo "the app exited early with $status"; exit 1; fi
          if grep -q "panicked" smoke.log; then echo "the app panicked"; exit 1; fi
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          desktop/target/debug/teamcraft-desktop > smoke.log 2>&1 &
          pid=$!
          sleep 20
          cat smoke.log
          if ! kill -0 "$pid" 2>/dev/null; then echo "the app exited early"; exit 1; fi
          kill "$pid"
          if grep -q "panicked" smoke.log; then echo "the app panicked"; exit 1; fi
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "desktop\target\debug\teamcraft-desktop.exe" -PassThru `
            -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Start-Sleep -Seconds 20
          Get-Content smoke.out, smoke.err -ErrorAction SilentlyContinue
          if ($p.HasExited) { Write-Error "the app exited early with $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if (Select-String -Path smoke.err -Pattern "panicked" -Quiet) { Write-Error "the app panicked"; exit 1 }
