[package]
name = "teamcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "TeamCraft – an open-source product lifecycle management (PLM) system for engineering teams"
license = "MPL-2.0"
readme = "README.md"
publish = false
default-run = "teamcraft"

[lib]
name = "teamcraft"
path = "src/lib.rs"

[[bin]]
name = "teamcraft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
# BOM import from CAD exports: CSV (MIT/Unlicense), Excel/ODS (MIT), Windows-1252 CSV (MIT/Apache)
csv = "1"
calamine = "0.38"
# Preview images embedded in Inventor / Solid Edge / SolidWorks files (OLE compound files, MIT)
cfb = "0.10"
crc32fast = "1"
encoding_rs = "0.8"
# ZIP export "Pack and Go" (MIT); Deflate via flate2/zlib-rs, no other codecs
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "chrono"] }
# SMTP for e-mail notifications (MIT); rustls/ring/webpki-roots as reqwest already uses
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
minijinja = "2"
# 3D preview, all pure Rust: glTF (MIT/Apache-2.0), 3MF/AMF XML (MIT),
# STEP B-rep reading and tessellation with the truck kernel (Apache-2.0)
gltf = { version = "1.4", default-features = false, features = ["utils"] }
quick-xml = "0.37"
truck-stepio = "0.3"
truck-meshalgo = { version = "0.4", default-features = false, features = ["analyzers", "filters", "tessellation"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
# BOM comparison export and .xlsx files for the import tests (MIT / Apache-2.0)
rust_xlsxwriter = { version = "0.102", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "set-header", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
