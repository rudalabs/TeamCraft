{% extends "base.html" %}
{% block title %}{{ status }} {{ reason }}{% endblock %}
{% block content %}
<div class="login">
  {% if branding and branding.wide %}
  <img class="login-logo" src="/branding/wide?v={{ branding.wide }}" alt="{{ (branding.display_name if branding and branding.display_name else instance_name) }}">
  {% else %}
  <img class="login-logo on-dark" src="/static/media/logos/TeamCraft_Logo_White.svg?v={{ assets }}" alt="TeamCraft">
  <img class="login-logo on-light" src="/static/media/logos/TeamCraft_Logo_Blue.svg?v={{ assets }}" alt="TeamCraft">
  {% endif %}
  <div class="card">
    <p class="meta">Error {{ status }}</p>
    <h2>{{ reason }}</h2>
    <p>{{ message }}</p>
    <div class="actions">
      <a class="button" href="/" data-back>Back</a>
      <a class="button primary" href="/">Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
