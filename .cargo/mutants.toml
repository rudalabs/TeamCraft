# cargo-mutants configuration (https://mutants.rs, MIT; a tool, not a
# dependency). Background and decision: docs/src/research/mutation-testing.md,
# how to run it and read the results: docs/src/dev/mutation-testing.md.
#
# Phase 1: only the pure modules whose rules the unit tests are meant to pin
# down, tested with `cargo test --lib` – no PostgreSQL, no integration tests,
# seconds per test run. Services, handlers and templates join only with a
# decision about database tests (docs/OPEN_WORK.md).

# The files whose code is mutated. A new pure module with unit tests belongs
# here; `cargo mutants --list --file <path>` shows what it would add.
examine_globs = [
    "src/domain/**/*.rs",
    "src/httprange.rs",
    "src/pagecontext.rs",
    "src/util.rs",
    "src/htmltext.rs",
    "src/resultscan.rs",
    "src/bomtable.rs",
    "src/cadformat.rs",
    "src/cadrefs.rs",
    "src/stepbom.rs",
]

# Mutants that are equivalent or not worth a test – each with its reason.
# The pattern matches the mutant's name as `cargo mutants --list` prints it.
# Add a rule only when such a mutant shows up in a report, e.g.
#   "<impl (fmt::)?(Debug|Display) for " for log-only output.
exclude_re = [
    # cell_text: at exactly 1e15 the whole-number branch and the float branch
    # print the same digits, so `<` and `<=` cannot be told apart.
    "src/bomtable.rs:.*replace < with <= in cell_text",
    # split_number: the last ',' and the last '.' are never at the same index,
    # so `c > d` and `c >= d` cannot be told apart.
    "src/bomtable.rs:.*replace > with >= in split_number",
    # cadrefs::names_in: `ext + 1` vs `ext * 1` only moves the stem end onto
    # the dot before the extension; the stem is only tested for letters and
    # digits, which the dot is not, and a name always has at least one
    # character before the dot.
    "src/cadrefs.rs:162:76: replace \\+ with \\* in names_in",
    # cadrefs::names_in: `stem > 0` vs `stem >= 0` – the same condition also
    # needs a letter or digit among the first `stem` characters, which an
    # empty stem never has.
    "src/cadrefs.rs:170:17: replace > with >= in names_in",
    # cadrefs::step_file_name_entity: searching FILE_NAME from 7 bytes before
    # `HEADER;` finds the same one – nine bytes ending before `HEADER;` cannot
    # start within those seven.
    "src/cadrefs.rs:257:43: replace \\+ with - in step_file_name_entity",
    # cadrefs::step_file_name_entity: starting the depth scan at `FILE_NAME`
    # instead of at its `(` only adds letters, which change neither depth nor
    # string state; without a `(` both return None.
    "src/cadrefs.rs:261:67: replace == with != in step_file_name_entity",
    # cadrefs::step_file_name_entity: without the escaped-quote arm, `''`
    # toggles the string state twice, which ends in the same state.
    "src/cadrefs.rs:268:22: replace match guard in_string && .* with false in step_file_name_entity",
    # htmltext::mostly_utf8: only called after an invalid byte was found, so
    # `invalid >= 1`; with no multi-byte character `invalid <= multibyte` is
    # false either way, so `multibyte > 0` vs `>= 0` cannot be told apart.
    "src/htmltext.rs:101:15: replace > with >= in mostly_utf8",
    # htmltext::Reader::push: inside a silent element `Reader::tag` always
    # pushes with `silent = true`, so `self.silent > 0` never decides alone.
    "src/htmltext.rs:680:38: replace > with < in Reader::push",
    # htmltext: the nesting caps (`tables.len() < MAX_DEPTH`) moved by one
    # level – 256 or 257 tracked tables/cells give the same text.
    "src/htmltext.rs:746:30: replace < with <= in Reader::start_cell",
    "src/htmltext.rs:815:38: replace < with <= in Reader::tag",
    # htmltext::read_tag: tag and attribute names cut at 32 or 33 characters;
    # start and end tags are cut alike and every name that matters is short.
    "src/htmltext.rs:871:23: replace < with <= in read_tag",
    "src/htmltext.rs:907:27: replace < with <= in read_tag",
    # htmltext::to_text: reading on after the text is full only costs time –
    # `Out::text` refuses every further character.
    "src/htmltext.rs:979:28: replace && with \\|\\| in to_text",
    # resultscan::compile_regex: the lazy-DFA cache limit only changes speed –
    # when the cache is full the regex crate falls back to a slower engine
    # with the same matches; the compile-time `size_limit` is tested.
    "src/resultscan.rs:431:42: replace \\* with (\\+|/) in compile_regex",
    # resultscan::glob_matches: backtracking to the `*` itself (`s * 1`)
    # instead of past it (`s + 1`) costs one loop step – the next step sees
    # the `*` and sets the same state (`pi = s + 1`, `mark` unchanged).
    "src/resultscan.rs:463:20: replace \\+ with \\* in glob_matches",
]

# Unit tests only (see above); the integration tests in tests/ need PostgreSQL.
# A cargo argument, not a test argument: the build step (`cargo test --no-run`)
# would otherwise compile all ~70 test binaries for every mutant.
additional_cargo_args = ["--lib"]

# Build profile without debug info (Cargo.toml [profile.mutants]): every
# mutant is an incremental rebuild of the lib test target, and linking the
# debug info is a large part of it.
profile = "mutants"

# A mutant that makes a loop endless is stopped after 5 × the baseline test
# time (cargo-mutants' default, at least 20 s); builds may take up to 10 ×
# the baseline build.
build_timeout_multiplier = 10.0

# mutants.out goes under target/ (git-ignored) instead of the tree root.
output = "target"
