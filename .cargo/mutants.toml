# cargo-mutants configuration (https://mutants.rs, MIT; a tool, not a
# dependency). Background and decision: docs/src/research/mutation-testing.md,
# how to run it and read the results: docs/src/dev/mutation-testing.md.
#
# Phase 1: only the pure modules whose rules the unit tests are meant to pin
# down, tested with `cargo test --lib` – no PostgreSQL, no integration tests,
# seconds per test run. Services, handlers and templates join only with a
# decision about database tests (docs/OPEN_WORK.md).

# The files whose code is mutated. A new pure module with unit tests belongs
# here; `cargo mutants --list --file <path>` shows what it would add.
examine_globs = [
    "src/domain/**/*.rs",
    "src/httprange.rs",
    "src/pagecontext.rs",
    "src/util.rs",
    "src/htmltext.rs",
    "src/resultscan.rs",
    "src/bomtable.rs",
    "src/cadformat.rs",
    "src/cadrefs.rs",
    "src/stepbom.rs",
]

# Mutants that are equivalent or not worth a test – each with its reason.
# The pattern matches the mutant's name as `cargo mutants --list` prints it.
# Add a rule only when such a mutant shows up in a report, e.g.
#   "<impl (fmt::)?(Debug|Display) for " for log-only output.
exclude_re = [
    # cell_text: at exactly 1e15 the whole-number branch and the float branch
    # print the same digits, so `<` and `<=` cannot be told apart.
    "src/bomtable.rs:.*replace < with <= in cell_text",
    # split_number: the last ',' and the last '.' are never at the same index,
    # so `c > d` and `c >= d` cannot be told apart.
    "src/bomtable.rs:.*replace > with >= in split_number",
    # cadrefs::names_in: `ext + 1` vs `ext * 1` only moves the stem end onto
    # the dot before the extension; the stem is only tested for letters and
    # digits, which the dot is not, and a name always has at least one
    # character before the dot.
    "src/cadrefs.rs:162:76: replace \\+ with \\* in names_in",
    # cadrefs::names_in: `stem > 0` vs `stem >= 0` – the same condition also
    # needs a letter or digit among the first `stem` characters, which an
    # empty stem never has.
    "src/cadrefs.rs:170:17: replace > with >= in names_in",
]

# Unit tests only (see above); the integration tests in tests/ need PostgreSQL.
# A cargo argument, not a test argument: the build step (`cargo test --no-run`)
# would otherwise compile all ~70 test binaries for every mutant.
additional_cargo_args = ["--lib"]

# Build profile without debug info (Cargo.toml [profile.mutants]): every
# mutant is an incremental rebuild of the lib test target, and linking the
# debug info is a large part of it.
profile = "mutants"

# A mutant that makes a loop endless is stopped after 5 × the baseline test
# time (cargo-mutants' default, at least 20 s); builds may take up to 10 ×
# the baseline build.
build_timeout_multiplier = 10.0

# mutants.out goes under target/ (git-ignored) instead of the tree root.
output = "target"
